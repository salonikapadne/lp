<!DOCTYPE html>
<html>
<head>
<title>Customer Support Chatbot</title>

<style>
body
{
font-family: Arial;
background-color: #f2f2f2;
text-align: center;
}

.chatbox
{
width: 400px;
margin: 50px auto;
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0px 0px 10px gray;
}

#chatArea
{
height: 300px;
overflow-y: auto;
border: 1px solid gray;
padding: 10px;
text-align: left;
margin-bottom: 10px;
background-color: #fafafa;
}

input
{
width: 70%;
padding: 10px;
}

button
{
padding: 10px 15px;
cursor: pointer;
}

.user
{
color: blue;
margin: 5px;
}

.bot
{
color: green;
margin: 5px;
}
</style>
</head>

<body>
<div class="chatbox">

<h2>Mobile Shop Chatbot</h2>

<div id="chatArea"></div>

<input type="text" id="userInput" placeholder="Type your message">

<button onclick="sendMessage()">Send</button>

</div>

<script>

function sendMessage()
{
let input = document.getElementById("userInput").value.toLowerCase();

let chatArea = document.getElementById("chatArea");

// Display user message
chatArea.innerHTML += "<p class='user'><b>You:</b> " + input + "</p>";

let response = "";

// Rule-based chatbot logic

if (input.includes("hello") || input.includes("hi")) {
	response = "Hello! How can I help you?";
} else if (input.includes("price")) {
	response = "Mobile prices start from Rs. 10,000.";
} else if (input.includes("offers")) {
	response = "We have 10% discount on selected mobiles.";
} else if (input.includes("timing")) {
	response = "Our shop timing is 10 AM to 9 PM.";
} else if (input.includes("contact")) {
	response = "You can contact us at 9876543210.";
} else if (input.includes("laptop")) {
	response = "Yes, laptops are available.";
} else if (input.includes("mobile")) {
	response = "We have Samsung, Apple, Vivo and OnePlus mobiles.";
} else if (input.includes("bye") || input.includes("exit")) {
	response = "Thank you for visiting our shop!";
} else {
	response = "Sorry, I do not understand your question.";
}

// Display bot response
chatArea.innerHTML += "<p class='bot'><b>Bot:</b> " + response + "</p>";

// Clear input box
document.getElementById("userInput").value = "";

// Auto scroll
chatArea.scrollTop = chatArea.scrollHeight;
}

</script>

</body>
</html>
